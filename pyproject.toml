[project]
name = "we-rd"
version = "0.1.0"
description = "WE-RD — automated weekly technical-curiosity newspaper"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "WE-RD contributors" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "feedparser>=6.0.11",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.3.0",
  "bleach>=6.2.0",
  "python-slugify>=8.0.4",
  "tenacity>=9.0.0",
  "structlog>=24.4.0",
  "slowapi>=0.1.9",
  "orjson>=3.10.0",
  "python-dateutil>=2.9.0",
  "numpy>=2.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
]
embeddings = [
  "sentence-transformers>=3.0.0",
]

[project.scripts]
weird-daily = "weird.pipeline.daily:main"
weird-sunday = "weird.pipeline.sunday:main"
weird-seed = "weird.seed:main"
weird-migrate = "weird.db:upgrade_head"
weird-export-site = "weird.pipeline.export_site:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages/core"]

[tool.setuptools.package-data]
weird = ["prompts/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["packages/core"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
