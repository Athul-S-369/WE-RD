name: Sunday publish → GitHub Pages

# End of week: editorial selection, export static newspaper, deploy Pages.
# Idempotent — safe to re-run the same Sunday.
#
# Deploy: Actions Pages if build_type=workflow, else push to gh-pages branch
# (same strategy as pages-bootstrap.yml).

on:
  schedule:
    - cron: "0 8 * * 0" # Sunday 08:00 UTC ≈ 13:30 IST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-sunday
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./data/weird.db
      WEIRD_DEMO_MODE: "false"
      WEIRD_LLM_PROVIDER: ${{ vars.WEIRD_LLM_PROVIDER || 'mock' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      WEIRD_STATIC_EXPORT: "1"
      NEXT_PUBLIC_STATIC: "1"
      NEXT_PUBLIC_BASE_PATH: ${{ vars.WEIRD_BASE_PATH || '/WE-RD' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install WE-RD
        run: pip install .

      - name: Ensure data directory
        run: mkdir -p data/pipeline apps/web/public/content

      - name: Init schema
        run: python -m weird.db

      - name: Seed demo if corpus empty
        run: |
          python - <<'PY'
          import os
          from weird.db import get_session_factory, init_db
          from weird.models import Story
          from weird.seed import seed
          init_db()
          s = get_session_factory()()
          try:
              if s.query(Story).count() == 0:
                  os.environ["WEIRD_DEMO_MODE"] = "true"
                  seed(s)
                  s.commit()
                  print("seeded demo corpus")
              else:
                  print(f"corpus has {s.query(Story).count()} stories")
          finally:
              s.close()
          PY

      - name: Run Sunday publication + export
        run: python -m weird.pipeline.sunday

      - name: Install web deps
        working-directory: apps/web
        run: npm install

      - name: Build static newspaper
        working-directory: apps/web
        run: |
          npm run build
          touch out/.nojekyll

      - name: Commit data + exported content
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(publish): Sunday WE-RD edition + Pages content"
          file_pattern: data/ apps/web/public/content/
          commit_user_name: Athul S
          commit_user_email: 176425883+Athul-S-369@users.noreply.github.com

      - uses: actions/upload-artifact@v4
        with:
          name: weird-sunday-site
          path: apps/web/out
          retention-days: 7

  probe-pages:
    needs: publish
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.probe.outputs.mode }}
    steps:
      - name: Probe Pages API
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          WEIRD_PAGES_TOKEN: ${{ secrets.WEIRD_PAGES_TOKEN }}
        run: |
          set -o pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages"
          auth="${WEIRD_PAGES_TOKEN:-$GH_TOKEN}"
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" || true)
          echo "GET /pages → HTTP $code"
          cat /tmp/pages.json || true
          if [ "$code" = "200" ]; then
            build_type=$(python -c "import json; print(json.load(open('/tmp/pages.json')).get('build_type') or '')")
            if [ "$build_type" = "workflow" ]; then
              echo "mode=actions" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "mode=branch" >> "$GITHUB_OUTPUT"

  deploy-actions:
    needs: [publish, probe-pages]
    if: needs.probe-pages.outputs.mode == 'actions'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: weird-sunday-site
          path: apps/web/out
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-branch:
    needs: [publish, probe-pages]
    if: needs.probe-pages.outputs.mode == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: weird-sunday-site
          path: site
      - run: touch site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: site
          publish_branch: gh-pages
          user_name: Athul S
          user_email: 176425883+Athul-S-369@users.noreply.github.com
          force_orphan: true
      - name: Summary
        run: |
          {
            echo "## Sunday edition published to \`gh-pages\`"
            echo ""
            echo "Live (after Pages cache): https://athul-s-369.github.io/WE-RD/"
            echo "Confirm Settings → Pages → Deploy from a branch → **gh-pages** / root."
          } >> "$GITHUB_STEP_SUMMARY"
