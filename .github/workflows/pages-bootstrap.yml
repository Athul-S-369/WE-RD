name: Bootstrap Pages (first deploy)

# Seeds corpus, builds static newspaper, deploys to GitHub Pages.
#
# ONE-TIME (required before deploy works):
#   https://github.com/Athul-S-369/WE-RD/settings/pages
#   → Build and deployment → Source → GitHub Actions
#
# Optional secret WEIRD_PAGES_TOKEN (classic PAT, repo scope) can create Pages via API.

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-bootstrap
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./data/weird.db
      WEIRD_DEMO_MODE: "true"
      WEIRD_LLM_PROVIDER: mock
      WEIRD_STATIC_EXPORT: "1"
      NEXT_PUBLIC_STATIC: "1"
      NEXT_PUBLIC_BASE_PATH: ${{ vars.WEIRD_BASE_PATH || '/WE-RD' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - run: pip install .
      - run: mkdir -p data/pipeline apps/web/public/content
      - run: python -m weird.db
      - run: python -m weird.seed
      - run: python -m weird.pipeline.export_site

      - working-directory: apps/web
        run: npm install && npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: weird-static-site
          path: apps/web/out
          retention-days: 7

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(publish): bootstrap demo edition for GitHub Pages"
          file_pattern: data/ apps/web/public/content/
          commit_user_name: we-rd-bot
          commit_user_email: we-rd-bot@users.noreply.github.com

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Diagnose / ensure Pages
        id: pages
        env:
          WEIRD_PAGES_TOKEN: ${{ secrets.WEIRD_PAGES_TOKEN }}
        run: |
          set -uo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages"
          auth_token="${WEIRD_PAGES_TOKEN:-$GITHUB_TOKEN}"

          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" || true)
          echo "GET /pages → HTTP $code"
          echo "----- body -----"
          cat /tmp/pages.json || true
          echo "----------------"

          if [ "$code" = "200" ]; then
            build_type=$(python -c "import json; print(json.load(open('/tmp/pages.json')).get('build_type',''))" 2>/dev/null || true)
            echo "build_type=$build_type"
            if [ "$build_type" = "workflow" ] || [ -z "$build_type" ]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Pages exists but source is a branch — try switch to workflow
            put_code=$(curl -sS -o /tmp/pages-put.json -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer $auth_token" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" \
              -d '{"build_type":"workflow"}' || true)
            echo "PUT build_type=workflow → HTTP $put_code"
            cat /tmp/pages-put.json || true
            if [ "$put_code" = "204" ] || [ "$put_code" = "200" ]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Try create with PAT (or GITHUB_TOKEN — usually fails, but we log it)
          post_code=$(curl -sS -o /tmp/pages-post.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $auth_token" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" \
            -d '{"build_type":"workflow"}' || true)
          echo "POST create Pages → HTTP $post_code"
          cat /tmp/pages-post.json || true
          if [ "$post_code" = "201" ] || [ "$post_code" = "204" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"
          {
            echo "## GitHub Pages is not enabled"
            echo ""
            echo "The newspaper **build succeeded** and was committed, but deploy cannot run until Pages exists."
            echo ""
            echo "### Do this once"
            echo "1. Open **[Settings → Pages](https://github.com/$GITHUB_REPOSITORY/settings/pages)**"
            echo "2. Under **Build and deployment → Source**, choose **GitHub Actions** (not \"Deploy from a branch\")"
            echo "3. Re-run **only the deploy job**, or run this workflow again"
            echo ""
            echo "Optional: add secret \`WEIRD_PAGES_TOKEN\` (classic PAT with **repo** scope) so the workflow can create Pages via API."
            echo ""
            echo "API probe: \`GET /pages\` returned **HTTP $code**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop with clear failure if Pages missing
        if: steps.pages.outputs.ready != 'true'
        run: |
          echo "::error title=Enable GitHub Pages first::Open https://github.com/$GITHUB_REPOSITORY/settings/pages → Source: GitHub Actions. Build job already produced the site artifact; only deploy is blocked."
          exit 1

      - uses: actions/download-artifact@v4
        with:
          name: weird-static-site
          path: apps/web/out

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

      - id: deployment
        uses: actions/deploy-pages@v4
