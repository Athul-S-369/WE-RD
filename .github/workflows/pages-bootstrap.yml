name: Bootstrap Pages (first deploy)

# One-click: seed demo corpus, export static site, deploy to GitHub Pages.
# Prerequisite: Settings → Pages → Source = GitHub Actions
# (GITHUB_TOKEN cannot create a Pages site; see docs/github-pages.md)

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DATABASE_URL: sqlite:///./data/weird.db
      WEIRD_DEMO_MODE: "true"
      WEIRD_LLM_PROVIDER: mock
      WEIRD_STATIC_EXPORT: "1"
      NEXT_PUBLIC_STATIC: "1"
      NEXT_PUBLIC_BASE_PATH: ${{ vars.WEIRD_BASE_PATH || '' }}
    steps:
      - uses: actions/checkout@v5

      # Fail fast: configure-pages enablement does NOT work with GITHUB_TOKEN.
      - name: Verify GitHub Pages is enabled
        env:
          WEIRD_PAGES_TOKEN: ${{ secrets.WEIRD_PAGES_TOKEN }}
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages"
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")
          if [ "$code" = "200" ]; then
            echo "Pages site OK"
            cat /tmp/pages.json
            exit 0
          fi
          if [ -n "${WEIRD_PAGES_TOKEN:-}" ]; then
            echo "Creating Pages site (build_type=workflow) via WEIRD_PAGES_TOKEN…"
            curl -fsS -X POST \
              -H "Authorization: Bearer $WEIRD_PAGES_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" \
              -d '{"build_type":"workflow"}'
            exit 0
          fi
          echo "::error title=GitHub Pages not enabled::Open https://github.com/$GITHUB_REPOSITORY/settings/pages → Build and deployment → Source: GitHub Actions. Save, then re-run this workflow. Optional: add secret WEIRD_PAGES_TOKEN (classic PAT with repo scope) to auto-create Pages."
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - run: pip install .
      - run: mkdir -p data/pipeline apps/web/public/content
      - run: python -m weird.db
      - run: python -m weird.seed
      - run: python -m weird.pipeline.export_site

      - working-directory: apps/web
        run: npm install && npm run build

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(publish): bootstrap demo edition for GitHub Pages"
          file_pattern: data/ apps/web/public/content/
          commit_user_name: we-rd-bot
          commit_user_email: we-rd-bot@users.noreply.github.com

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
      - id: deployment
        uses: actions/deploy-pages@v4
