name: Bootstrap Pages (first deploy)

# Seeds corpus, builds static newspaper, publishes it.
#
# Deploy strategy:
#   1) Prefer official GitHub Actions Pages (if already enabled)
#   2) Else push site to `gh-pages` branch (works with GITHUB_TOKEN)
#      → then set Settings → Pages → Deploy from a branch → gh-pages
#
# Optional: secret WEIRD_PAGES_TOKEN (classic PAT, repo scope) can create/update Pages via API.

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-bootstrap
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./data/weird.db
      WEIRD_DEMO_MODE: "true"
      WEIRD_LLM_PROVIDER: mock
      WEIRD_STATIC_EXPORT: "1"
      NEXT_PUBLIC_STATIC: "1"
      NEXT_PUBLIC_BASE_PATH: ${{ vars.WEIRD_BASE_PATH || '/WE-RD' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - run: pip install .
      - run: mkdir -p data/pipeline apps/web/public/content
      - run: python -m weird.db
      - run: python -m weird.seed
      - run: python -m weird.pipeline.export_site

      - working-directory: apps/web
        run: |
          npm install
          npm run build
          # Ensure GitHub Pages does not run Jekyll on the export
          touch out/.nojekyll

      - uses: actions/upload-artifact@v4
        with:
          name: weird-static-site
          path: apps/web/out
          retention-days: 7

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(publish): bootstrap demo edition for GitHub Pages"
          file_pattern: data/ apps/web/public/content/
          commit_user_name: we-rd-bot
          commit_user_email: we-rd-bot@users.noreply.github.com

  probe-pages:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.probe.outputs.mode }}
    steps:
      - name: Probe Pages API
        id: probe
        env:
          WEIRD_PAGES_TOKEN: ${{ secrets.WEIRD_PAGES_TOKEN }}
        run: |
          set -uo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages"
          auth="${WEIRD_PAGES_TOKEN:-$GITHUB_TOKEN}"

          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" || true)
          echo "GET /pages → HTTP $code"
          cat /tmp/pages.json || true

          if [ "$code" = "200" ]; then
            build_type=$(python -c "import json; print(json.load(open('/tmp/pages.json')).get('build_type') or '')")
            echo "build_type=$build_type"
            if [ "$build_type" = "workflow" ]; then
              echo "mode=actions" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Try switch to workflow with PAT/token
            put=$(curl -sS -o /tmp/put.json -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer $auth" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" -d '{"build_type":"workflow"}' || true)
            echo "PUT workflow → HTTP $put"
            if [ "$put" = "204" ] || [ "$put" = "200" ]; then
              echo "mode=actions" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Branch-based Pages already on — publish via gh-pages
            echo "mode=branch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Try create Actions-based Pages (needs admin PAT usually)
          post=$(curl -sS -o /tmp/post.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $auth" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" -d '{"build_type":"workflow"}' || true)
          echo "POST workflow → HTTP $post"
          cat /tmp/post.json || true
          if [ "$post" = "201" ]; then
            echo "mode=actions" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Default: publish to gh-pages branch (no Pages admin required)
          echo "mode=branch" >> "$GITHUB_OUTPUT"
          {
            echo "## Deploy mode: \`gh-pages\` branch"
            echo ""
            echo "Actions Pages is not enabled yet (GET /pages → HTTP $code)."
            echo "This run will push the static site to the **gh-pages** branch."
            echo ""
            echo "### Make it live (one click)"
            echo "1. Open **[Settings → Pages](https://github.com/$GITHUB_REPOSITORY/settings/pages)**"
            echo "2. Source: **Deploy from a branch**"
            echo "3. Branch: **gh-pages** / **root** → Save"
            echo "4. Site: https://athul-s-369.github.io/WE-RD/"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-actions:
    needs: [build, probe-pages]
    if: needs.probe-pages.outputs.mode == 'actions'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: weird-static-site
          path: apps/web/out

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-branch:
    needs: [build, probe-pages]
    if: needs.probe-pages.outputs.mode == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: weird-static-site
          path: site

      - name: Ensure .nojekyll
        run: touch site/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
          user_name: we-rd-bot
          user_email: we-rd-bot@users.noreply.github.com
          force_orphan: true

      - name: Try enable branch Pages via API
        env:
          WEIRD_PAGES_TOKEN: ${{ secrets.WEIRD_PAGES_TOKEN }}
        run: |
          set -uo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages"
          auth="${WEIRD_PAGES_TOKEN:-$GITHUB_TOKEN}"
          # Create legacy (branch) Pages if missing
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" || true)
          if [ "$code" = "200" ]; then
            echo "Pages already configured"
            cat /tmp/pages.json
            exit 0
          fi
          post=$(curl -sS -o /tmp/post.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $auth" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}' || true)
          echo "POST legacy gh-pages → HTTP $post"
          cat /tmp/post.json || true
          if [ "$post" != "201" ]; then
            echo "::notice::Site files are on the gh-pages branch. Enable Pages manually: Settings → Pages → Deploy from a branch → gh-pages / (root)."
          else
            echo "::notice::Pages enabled from gh-pages branch. Live at https://athul-s-369.github.io/WE-RD/"
          fi

      - name: Summary
        run: |
          {
            echo "## Published to \`gh-pages\`"
            echo ""
            echo "Static newspaper is on the **gh-pages** branch."
            echo ""
            echo "If the site 404s, finish setup:"
            echo "1. [Settings → Pages](https://github.com/$GITHUB_REPOSITORY/settings/pages)"
            echo "2. **Deploy from a branch** → **gh-pages** / **/(root)**"
            echo "3. Open https://athul-s-369.github.io/WE-RD/"
          } >> "$GITHUB_STEP_SUMMARY"
